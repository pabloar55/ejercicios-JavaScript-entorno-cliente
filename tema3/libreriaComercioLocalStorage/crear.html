<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styleCrear.css">
    <script type="module" src="almacenar.js" defer></script>
</head>

<body>
    <main id="main">
        <form action="" method="" id="idForm">
            <div>
                <label for="idTitulo">Titulo: </label>
                <input type="text" name="titulo" id="idTitulo">
            </div>
            <div>
                <label for="idAutor">Autor: </label>
                <input type="text" name="autor" id="idAutor">
            </div>
            <div>
                <label for="idPaginas">Paginas: </label>
                <input type="number" name="paginas" id="idPaginas">
            </div>
            <div>
                <label for="idPrestado">Prestado</label>
                <input type="checkbox" name="prestado" id="idPrestado">
            </div>
            <div>
                <input type="submit" value="Guardar" name="guardar">
            </div>
        </form>
    </main>
</body>

</html>
